name: 'main tests status'

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: 'Build and test'

    runs-on: windows-latest

    steps:
    - name: Checkout files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'
    - name: Setup NBGV
      uses: dotnet/nbgv@705dad19ab067f12f4e9eeaa60812e01edef5d25 # v0.5.2
      with:
        toolVersion: 3.9.50
    - name: Restore dependencies
      run: dotnet restore "${{ github.workspace }}/src/SDK.sln"
    - name: Build solution
      run: dotnet build "${{ github.workspace }}/src/SDK.sln" --no-restore -c Release
    - name: Run tests
      run: dotnet test "${{ github.workspace }}/src/SDK.sln" -c Release --no-build --verbosity normal
